<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Add some basic styling so it looks nice out of the box -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1, h2, h3 { color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
      a { color: #0366d6; text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { background-color: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-family: ui-monospace, monospace; }
      pre { background-color: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
      blockquote { color: #6a737d; border-left: 0.25em solid #dfe2e5; padding: 0 1em; margin: 0; }
      /* Markdown table styling */
      table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
      th, td { border: 1px solid #dfe2e5; padding: 6px 13px; text-align: left; }
      tr:nth-child(2n) { background-color: #f6f8fa; }
    </style>
  </head>
  <body>
    <!-- GitHub Pages content injection -->
    {{ content }}
    
    <!-- Initialize Mermaid.js for diagrams -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true, theme: 'default' });
    </script>
    <!-- Simple script to convert markdown mermaid blocks to html for the library -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const elements = document.querySelectorAll('code.language-mermaid');
        elements.forEach(el => {
            const pre = el.parentElement;
            const mermaidDiv = document.createElement('div');
            mermaidDiv.className = 'mermaid';
            mermaidDiv.textContent = el.textContent;
            pre.parentNode.replaceChild(mermaidDiv, pre);
        });
      });
    </script>
  </body>
</html>
